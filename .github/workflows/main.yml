name: Automação da Lista M3U

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 00:00 (Horário de Brasília)
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Executar script de atualização
        run: python m3uactuality.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add minha_lista.m3u
          git commit -m "Atualização automática da lista M3U" || exit 0
          git push
