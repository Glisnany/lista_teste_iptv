name: Automação da Lista M3U

on:
  schedule:
    - cron: '0 7 * * *' # Executa diariamente às 04:00 da manhã (Horário de Brasília)
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar script de atualização
        run: python m3uactuality.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add minha_lista.m3u
          git commit -m "Atualização automática da lista M3U" || exit 0
          git push origin main
